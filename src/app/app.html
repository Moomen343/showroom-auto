<app-head-bar></app-head-bar>

<app-search-bar
  [searchTerm]="searchTerm"
  (searchChange)="onSearchChange($event)">
</app-search-bar>

<div class="cards">
  @for (auto of filteredAutoList; track auto.id) {
    <div class="card">
      <img [src]="'images/' + auto.photo" [alt]="auto.brand + ' ' + auto.model">
      <h2>{{ auto.brand }} {{ auto.model }}</h2>
      <p>Power : {{ auto.power }}</p>
      <p>Price : {{ auto.price }} DNT</p>
      <p>Only {{ auto.availability }} units in stock</p>
      <a (click)="selectAuto(auto)">See more...</a>
    </div>
  }
</div>

@if (selectedAuto) {
  <div class="description">
    <h3>{{ selectedAuto.model }}</h3>
    <p>{{ selectedAuto.description }}</p>
  </div>
}

<div class="footer"></div>
